# tools.lock: the exact tools of the dataset v1 build.
#
# Format: tab-separated values. Lines that start with "#" are comments.
# One row for each tool version. Columns:
#   tool            the tool: ctp (the runner), cregit (the token blame), srcml (the tokenizer),
#                   blobexec-jar, env (the Nix environment).
#   repo            a generic repository name.
#   commit          the full commit SHA (or the version, for env rows).
#   bundle_file     the git bundle file that the build ran ("-" if no bundle was used).
#   bundle_sha256   the sha256 of that bundle file.
#   bundle_bytes    the size of that bundle file in bytes.
#   bundle_requires the commit that must be present before "git fetch" from the bundle
#                   ("-" for a complete bundle).
#   used_by         the runs (batches) that used this version.
#   gate_sha256     the sha256 of the libexpat gate Parquet file (libexpat at commit
#                   a76b1174c1ea52abb639a4c69d52b630a8a106a2, fixed flags). Each run machine
#                   made this file first and compared it before the dataset build started.
#   gate_bytes      the size of the gate Parquet file in bytes.
#   notes           other facts.
#
# Each value was checked on 2026-10-14 against a file, a git object or a recorded
# SHA256SUMS. "UNKNOWN" means that no file or object was found to check the value.
# REPRODUCE.md lists each UNKNOWN value.
#
# Caveat (in-place swap): on 2026-10-11 from 20:05 UTC, about 26 running copies at cregit
# 95cdc88 or 1f17663 got the blameRepo/formatBlame.pl file of 57551d7 (sha256 788acb9a...)
# while they ran. Their ledgers still name the old commit. Files that started after the
# swap used the 57551d7 blame code. pipeline/s7-run/blame-time-limit.md gives the details.
#
