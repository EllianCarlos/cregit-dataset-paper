# ta.conf: the values of the kit tom-add-159-kit (the 159 new projects of the tokei funnel, run through the TOM
# pipeline at their funnel pins, for TOM 1.0.0). A tool of the stage: S1 stages it, the machine scripts source it.
BUCKET=BUCKET_NAME
# The S3 prefix: tools/ (the stage, U1), run/<Name>/ (the public results of one machine), private/<Name>/ (the
# registries of the pseudonym write: they hold real identities, as dataset-final/private/ of the TOM write).
PREFIX=tom-add-159
# TOM 1.0.0 on Hugging Face (anonymous, no token): the gate file comes from this revision.
HF_BASE=https://huggingface.co/datasets/elliancarlos/token-on-me/resolve/e81b554deb9b
# The code of the direct write of ctp schema 3 (the tools of TOM; tools.lock rows ctp a9f0bed, cregit 8d60a8f).
CREGIT_COMMIT=c65f1e718bef786d67ebb3e2ea9f5f833ea42169      # cregit fork fix/schema-3-bare-cr: feat/schema-3 8d60a8f (57551d7 + 14b8db4 + schema 3)
#   + fbbf42f (the .blame lines split on LF only: a bare CR stays in its token) + c65f1e7 (23e4ccb cherry-picked:
#   plain blame after a git exit 128 of -C100; TOM used it for 1 project)
CREGIT_BASE=57551d7ad82a784615c1490623d72cb9dc994ba1        # s3://BUCKET/cregit/cregit-57551d7.bundle (the TOM runs)
CREGIT_BASE_BUNDLE_SHA=18b1bf1c87230460f59e433f0c5106f21dde77bfbc057a42776acb592a6eb71e
CTP_COMMIT=a9f0bedcb71c351d7f943a4d03fd6c221b6fed24         # ctp feat/schema-3-run
# The srcML library of the TOM runs (with the non-termination patch; the AMI cregit tree; R1 checks it).
WANT_SRCML=dea4467bb1b0a435e4536be13367325564b82e14ff69b478ad31bf144a8455f3
DUCKDB=1.5.5
# The license pass: the stage of license-scancode-kit in s3://BUCKET/license-scancode/tools/ (ctp 6b6efcf,
# ScanCode 32.5.0, licensee 10.1.0, askalono 0.5.0). R1 checks its SHA256SUMS against LSC_WANT_SUMS.
LSC_PREFIX=license-scancode/tools
LSC_WANT_SUMS=285b432a6d75ee409ac9dd4c59e6984dd193f00b7b24050f26af5ea5588b4899
LSC_JOBS=24
# The pseudonyms of pass 2 (the user, 2026-11-08): PASS2_MODE=newsalt, a new random salt made on the machine (never
# printed, never off the machine, shredded at the end). TOM is built in batches; each batch has its own salt, which is
# deleted at the end of the batch; personid is stable only inside a batch. Empty PASS2_MODE: pass 2 waits for
# $X/pass2.mode. TOM_REGISTRY: the private registry of the TOM write (read on the machine for its space and token
# columns only: a new token equal to a TOM token stops the run).
PASS2_MODE=newsalt
TOM_REGISTRY=s3://BUCKET_NAME/dataset-brlcad/private/dataset-brlcad-1/registry.parquet
# The organization links: version v4.9 (companies.v4.9.duckdb, the db of the TOM write).
ORGANIZATIONS_VERSION=v4.9
# The license value of the column (TOM rule of the second release pass): GitHub rows keep the sidecar value (the
# GitHub detection, else NOASSERTION); the other hosts get the real ids of licensee at confidence 98 (';'-joined),
# else NOASSERTION, with licensee 9.18.0 (the version of the TOM fill; LICENSEE918, a Nix closure in the stage) on
# the root license files and package files of the license pass folder (the file choice of the TOM fill). LICENSE_RULE=scancode puts the ScanCode decision in the column instead (not TOM).
LICENSE_RULE=tom
# The run: PARALLEL projects at a time; --blame-jobs, --memory-limit, --duckdb-threads per project (these do not
# change the output: the files of the blame step are independent; the memory limit and the threads of the DuckDB
# steps change only the speed). Machine A (group bulk, m6id.32xlarge: 128 vCPU, 512 GiB): 26 projects at a time.
# Machine B (group long, m6id.32xlarge): visualboyadvance-m, codebase-memory-mcp and ripwire at a time, each with
# 60 blame jobs and a large DuckDB memory limit (step 10 of visualboyadvance-m: about 590 M rows). B1 EXPORTS win.
PARALLEL=26
BLAME_JOBS=16
MEMORY_LIMIT=12GB
DUCKDB_THREADS=4
# The write of pass 2 (ta_tools.py write): WRITE_JOBS files at a time.
WRITE_JOBS=8
# The precheck step (depth-1 fetch, sizes, vendor-like and generated-like shares) before the run: group long only.
PRECHECK=0
case "${GROUP:-}" in
  extra) PARALLEL=7; BLAME_JOBS=16; MEMORY_LIMIT=48GB; DUCKDB_THREADS=8; WRITE_JOBS=7 ;;
  long) PARALLEL=3; BLAME_JOBS=60; MEMORY_LIMIT=150GB; DUCKDB_THREADS=32; WRITE_JOBS=3; PRECHECK=1 ;;
esac
# The gate project: a small TOM project through both passes; the result must equal its TOM file in all 53 columns.
GATE=tio__tio
# The end: DONE stops the machine at once; ALERT after ALERT_HOLD_MIN minutes. NOSHUT=1 keeps it up.
ALERT_HOLD_MIN=90
NOSHUT=0
# The Nix store path of the license tools (TOOLS_STORE_PATH of lsc.conf; R1 imports it from the lsc stage).
LSC_STORE=/nix/store/36h96sg9yafg1dqa8jxgh6nws5avzvd7-license-scan-tools
LSC_CTP_COMMIT=6b6efcf1e1e80f4f828ccfb18b3eb5a770d9be23
LICENSEE_VERSION=10.1.0
TOOLS_JAVA_JAR_SHA=bf99a8b2ffbea238c1451c6b4be568870f18b4aac93d0dbff755f2b0b7ce43f3
# The writer of the published files: reencode_parquet.py of ctp feat/parquet-reencode (the release settings:
# pyarrow 26.0.1, Parquet 2.6, data page V1, ZSTD 19, row groups of 1,000,000 rows, no page index, no ARROW:schema)
# with reencode.json: the Bloom filters on the 4 release columns that schema 3 keeps (file_path, token_value,
# source_text, personid; cregit_commit_sha is not in schema 3). Local proof: the re-encode of the TOM file of
# tio__tio with these settings gives its published bytes (sha256 f5c634885b97...).
REENCODE_COMMIT=c2a8432
REENCODE_SETTINGS_SHA=17a4bdb83b3c48db56ba33e4b0ebe6653798c717a450896fac172112f9b5cb02
PYARROW=26.0.1
# licensee 9.18.0 of the TOM fill (the store path of the local Nix build; S1 stages its closure, R1 imports it).
LICENSEE918=/nix/store/kpm5fgccwd55yfzz9isj51sy9k37hvn1-licensee-9.18.0
