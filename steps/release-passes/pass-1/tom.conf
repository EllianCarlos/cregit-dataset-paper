# tom.conf: the values of the kit dataset-tom (the release pass of the dataset "Token on Me" (TOM), version 1.0.0).
# A tool of the stage: S1 stages it, tom_run.sh and the kit scripts source it.
BUCKET=BUCKET_NAME
# The source root (read only): the re-encoded root (pyarrow 26.0.1), 10,754 project files.
SRC_ROOT=dataset-release/dataset-v1.0.0-reencode/root
SRC_SUMS_SHA=d35e913a0121a188857afef834c3eb11729a4e86e95335b0d0d5e165dbb48964
SRC_FILES=10754
# The new prefix: tools/ (the stage, U1), root/ (the new root; the run refuses a non-empty root/), log/ (the run logs).
DEST=dataset-release/dataset-v1.0.0-tom
# The subset: the projects of keep/projects.keep.txt (the stage copy of the KEEP input of S1) minus these projects.
DROP_PROJECTS="dust-tt__dust abgox__PSCompletions milisp__codexia"
# The Hugging Face limit is 10,000 entries in one folder: parquet/ must have fewer.
MAX_PARQUET_FILES=9999
# The expected subset (tokei rule list of 2026-11-07, 8,447 lines; the 3 gone repos and 7 fetch failures are not in
# it): the file count, the token rows (sum of the footer num_rows) and the input bytes. The pass stops on another
# value (keep step: the source footers; check step: the output footers).
EXPECT_KEEP_FILES=8447
EXPECT_KEEP_ROWS=30406900014
EXPECT_KEEP_IN_BYTES=127424637166
# The columns of the TOM schema (71 - 10 dropped).
EXPECT_COLUMNS=61
# The column changes (column review, agreed changes 3, 9, 12, 21, 22, 25): one pass of parquet_rename.py per file.
DROP_COLUMNS="size_kb file_mask manifest_category fact history_cluster history_shared_with history_relation history_includes history_first history_created"
RENAME="provenance_status=audit_frame_file"
# The footer key-values that the same pass sets (parquet_rename.py --set-kv; the docs and fill_release.py check
# require ctp schema 3: 61 columns, audit_frame_file).
SET_KV="ctp_schema_version=3"
# The values that the review found in the dropped columns (all 10,754 files). A file with another value stops the
# pass (a drop must lose no data). fact is not checked: its values move to the side table project_facts.
EXPECT_EMPTY="size_kb history_cluster history_shared_with history_relation history_includes history_first history_created"
EXPECT_MANIFEST_CATEGORY=pending
EXPECT_FILE_MASK='(?i)\.(c|c\+\+|cc|cp|cpp|cxx|h|h\+\+|hh|hpp|hxx|java|rs|tcc)$'
# The first file of the pass, alone: drop + check, and the pass stops when it fails. Empty or not kept: the
# smallest kept file.
CANARY=libexpat__libexpat
# The copy mode of parquet_rename.py (read-write: plain pread/pwrite, the same path as the local test).
COPY_MODE=read-write
# The side table of the facts (change 25: one row per project and fact) and its view in organizations/dataset.duckdb.
FACTS_REL=organizations/project_facts.parquet
FACTS_VIEW=project_facts
# organizations/: subset (project_organizations.parquet with the kept projects only, release_info.parquet with its
# new rows and sha256 and those of project_facts; the docs say one row for each project file) or copy (as the source).
ORGS=${ORGS:-subset}
# ledgers.parquet: subset (only the rows of the kept projects) or copy (byte-identical).
LEDGERS=${LEDGERS:-subset}
# fill_release.py check (tools/fill_release.py of the docs input) must pass: require (default) or report.
FILL_CHECK=${FILL_CHECK:-require}
# The size_class rule of change 24 (commits; a query, not a column): the counts go to the report and the markers.
SIZE_RULE="SS:0:1499 S:1500:2499 M:2500:4999 L:5000:14999 XL:15000:49999 XXL:50000:-"
# The tools of ctp (branch feat/parquet-footer-rename): parquet_rename.py and parquet_rename_check.py of this commit
# (467677c on top of 2acf7e0: --set-kv).
CTP_COMMIT=467677c8dbc0f8a794c6ef7517daca8941582b58
# The smoke test of R1: drop + rename of one small source file; the output sha256 of the local test (2026-11-07,
# the same tool and input give the same bytes).
SMOKE=libexpat__libexpat-dataset.parquet
SMOKE_OUT_SHA=a1b4fa6609afc8455b49c7fed0d3f0a4acc03bcd659eb8523cb9cb13cf3ecaec
# Pinned versions on the machine (the same as the re-encode and the Hugging Face kits).
PYARROW=26.0.1
DUCKDB=1.5.5
HF_HUB_VERSION=2.4.0
HF_XET_VERSION=1.8.0
# The driver: JOBS empty = half the vCPU count (one file for each physical core).
JOBS=${JOBS:-}
# Hugging Face (the values of ../dataset-hf/hf.conf): public from the start (user decision 2026-11-07).
HF=${HF:-1}
HF_REPO=${HF_REPO:-elliancarlos/token-on-me}
HF_VISIBILITY=${HF_VISIBILITY:-public}
HF_SSM_PARAM=/tom/hf-token
HF_TOKEN_DIR=/run/tom-hf
HF_BATCH_FILES=1000
HF_BATCH_BYTES=20000000000
HF_MAX_ENTRIES_PER_FOLDER=10000
HF_REC_FILES_PER_REPO=100000
HF_REC_FILE_BYTES=200000000000
HF_MAX_FILE_BYTES=500000000000
HF_PRIVATE_QUOTA_FREE=100000000000
HF_PRIVATE_QUOTA_PRO=1000000000000
HF_PUBLIC_NOTE_BYTES=50000000000
# The end: on DONE the instance shuts down at once (L1 sets the stop behavior: the instance stops, it does not
# terminate). On ALERT it waits ALERT_HOLD_MIN minutes first (time to look), then shuts down. /run/tom-hold or
# NOSHUT=1 keeps it up.
ALERT_HOLD_MIN=${ALERT_HOLD_MIN:-90}
