# tom4.conf: the values of the kit dataset-tom-4 (the DOI pass of the dataset "Token on Me" (TOM) 1.0.0: docs only).
# A tool of the stage: S1 stages it (with DOI and DATE), tom4_run.sh and the kit scripts source it.
BUCKET=BUCKET_NAME
# The input root (read only): the output of the third pass (kit ../dataset-tom-3), 8,449 project files, 53 columns.
# The run fetches only its files outside parquet/ (and SHA256SUMS); it reads the footers of the project files by
# ranged reads.
TOM3=dataset-release/dataset-v1.0.0-tom-3
TOM3_ROOT=$TOM3/root
# The TOM-3 SHA256SUMS: root_sha256sums of TOM3/log/final.status.json must start with TOM3_SUMS_PREFIX (the
# coordinator: 820f6e8233d8). TOM3_SUMS_SHA (S1 writes it when given) must then be equal to it.
TOM3_SUMS_PREFIX=820f6e8233d8
TOM3_SUMS_SHA=
# The Hugging Face revision of TOM-3 (information only; the run verifies the Hub tree against the TOM-3 SHA256SUMS).
TOM3_HF_REVISION=bc7543affd2e
# The new prefix: tools/ (the stage, U1), root/ (the new root; a server-side copy of the 8,449 project files of TOM-3
# and an upload of the other files), log/.
DEST=dataset-release/dataset-v1.0.0-tom-4
MAX_PARQUET_FILES=9999
EXPECT_FILES=8449
EXPECT_ROWS=30408388202
EXPECT_COLUMNS=53
SCHEMA_VERSION=3
# The DOI and the release date. S1 writes them (DOI=... DATE=... at stage time); the run refuses the empty values.
# DOI must match DOI_PATTERN (the Hugging Face DataCite prefix 10.57967, path hf/<number>).
DOI=10.57967/hf/11505
DATE=2026-11-07
DOI_PATTERN='^10\.57967/hf/[0-9]{1,9}$'
DATE_MIN=2026-11-07
DATE_MAX=2027-12-31
# The marker lines of the docs input: S1 counts them in the staged docs and writes them here (the staged copy). The
# run refuses empty values; the fill must replace all of them. README.md and CITATION.cff need at least 1 TODO-DOI
# line each, CITATION.cff at least 1 TODO-DATE line (S1).
EXPECT_DOI_LINES=5
EXPECT_DATE_LINES=3
# The files that may change in this pass are documents only. These files must keep their TOM-3 bytes.
KEEP_SAME="MANIFEST.tsv ledgers.parquet links.json pseudonymization.json organizations/"
# The removed documents (user decision 2026-11-07 18:20 BRT): the TOM-3 documents that the docs input does not have.
# S1 (against the kit-3 stage docs) and the run (against the TOM-3 SHA256SUMS) require this exact list. The new root
# does not have them, SHA256SUMS drops their rows, the Hugging Face push deletes them.
REMOVED_DOCS="docs/LIMITATIONS.md docs/PROVENANCE.md docs/RELEASE-NOTES.md"
# The S3 copy: the project files of TOM-3 by a server-side copy (--copy-props metadata-directive: no tag calls). Each
# copy must have the TOM-3 size and ETag; a copy with another ETag is downloaded and hashed (its sha256 must be the
# SHA256SUMS row). HASH_SAMPLE more project files (a seeded sample) are downloaded and hashed in any case.
HASH_SAMPLE=${HASH_SAMPLE:-32}
HASH_SEED=tom4:20261107
# Pinned versions on the machine (the same as kits 1 to 3), and boto3 for the footer reads.
PYARROW=26.0.1
DUCKDB=1.5.5
HF_HUB_VERSION=2.4.0
HF_XET_VERSION=1.8.0
BOTO3_SPEC="boto3>=1.35,<2"
# The footer reads: threads, and the first ranged read (the end of each file).
FOOTER_JOBS=${FOOTER_JOBS:-32}
FOOTER_FIRST=262144
# The smoke test of R1: the footer of this TOM-3 file by a ranged read (53 columns, its MANIFEST.tsv rows and bytes).
SMOKE=libexpat__libexpat-dataset.parquet
# Hugging Face: the same repository, public. Only the changed documents and SHA256SUMS are pushed (README.md and
# SHA256SUMS in the last commit).
HF=${HF:-1}
HF_REPO=${HF_REPO:-elliancarlos/token-on-me}
HF_VISIBILITY=${HF_VISIBILITY:-public}
HF_SSM_PARAM=/tom/hf-token
HF_TOKEN_DIR=/run/tom4-hf
HF_MAX_ENTRIES_PER_FOLDER=10000
HF_REC_FILES_PER_REPO=100000
HF_REC_FILE_BYTES=200000000000
HF_MAX_FILE_BYTES=500000000000
HF_PRIVATE_QUOTA_FREE=100000000000
HF_PRIVATE_QUOTA_PRO=1000000000000
HF_PUBLIC_NOTE_BYTES=50000000000
# The Hub must hold the TOM-3 root before the push (hf_tools.py verify against the TOM-3 SHA256SUMS): require or skip.
HF_PRE_VERIFY=${HF_PRE_VERIFY:-require}
# The end: on DONE the instance shuts down at once (L1 sets the stop behavior); on ALERT after ALERT_HOLD_MIN minutes.
ALERT_HOLD_MIN=${ALERT_HOLD_MIN:-90}
