# tom5.conf: the values of the kit dataset-tom-5 (a revision of the dataset "Token on Me" (TOM) 1.0.0: the 149 new
# project files and the license values). A tool of the stage: S1 stages it, tom5_run.sh and the kit scripts source it.
BUCKET=BUCKET_NAME
# The source root (read only): the published root of TOM 1.0.0 (kit ../dataset-tom-4), 8,449 files, 53 columns.
TOM4=dataset-release/dataset-v1.0.0-tom-4
TOM4_ROOT=$TOM4/root
TOM4_SUMS_SHA=b7141d088461944872033563ac6609cb6fe846ec179e6aae6eeed62078186899
TOM4_FILES=8449
TOM4_ROWS=30408388202
# The Hugging Face revision of the TOM-4 root (the Hub must hold it before the push: HF_PRE_VERIFY).
TOM4_HF_REVISION=e81b554deb9b
# The new files: the run prefix of each new-project machine (kit ../tom-add-159-kit). Each must have
# status/run.DONE; its results/MANIFEST.new.tsv names its files.
NEW_RUNS="tom-add-159-1 tom-add-159-2 tom-add-159-3"
NEW_PREFIX=tom-add-159/run
EXPECT_NEW=149
# The new prefix: tools/ (the stage, U1), root/ (the new root; the run refuses a non-empty root/), log/.
DEST=dataset-release/dataset-v1.0.0-tom-5
MAX_PARQUET_FILES=9999
EXPECT_FILES=8598
EXPECT_COLUMNS=53
# The reference file of the Parquet form gate (the gate project of the new-project kit, a TOM-4 file).
SHAPE_REF=tio__tio-dataset.parquet
# The value pass: the license column only (ctp parquet_rename.py --values; no drop, no rename, no key change).
CTP_COMMIT=e9c7656e59c18316cda1b83acf81cb1d8fc9bca6
COPY_MODE=read-write
# The license pass code (ctp feat/license-scan): the rescan of the new projects and the rule.
LSC_COMMIT=0f9b8ad
# The scanner tools: the stage of ../license-scancode-kit in S3 (license-scancode/tools/, its SHA256SUMS sha256).
LSC_TOOLS_PREFIX=license-scancode/tools
LSC_TOOLS_SUMS=285b432a6d75ee409ac9dd4c59e6984dd193f00b7b24050f26af5ea5588b4899
LSC_JOBS=${LSC_JOBS:-12}
# The universal file mask of the new projects (the file_mask_sha256 of their ledger rows; the TOM-4 value).
FILE_MASK_SHA256=665c23c018b48f0f9bb6f89e6e9233d679a1a0826895cb6c6a962cf51c785bbd
# The side table of this revision and the views that check-root requires.
NEED_VIEWS="tokens project_facts project_hosts project_sponsors project_languages project_labels project_licenses release_info"
# TOM-4 files that the new root may lack (none).
ALLOW_GONE=""
# Pinned versions on the machine (the same as the earlier passes), and boto3 for the footer reads.
PYARROW=26.0.1
DUCKDB=1.5.5
HF_HUB_VERSION=2.4.0
HF_XET_VERSION=1.8.0
BOTO3_SPEC="boto3>=1.35,<2"
FOOTER_JOBS=${FOOTER_JOBS:-48}
FOOTER_FIRST=262144
JOBS=${JOBS:-}
ETAG_CHECK=${ETAG_CHECK:-require}
# Hugging Face: the same repository, public; a new revision (commits) with the changed and new files only.
HF=${HF:-1}
HF_REPO=${HF_REPO:-elliancarlos/token-on-me}
HF_VISIBILITY=${HF_VISIBILITY:-public}
HF_SSM_PARAM=/tom/hf-token
HF_TOKEN_DIR=/run/tom5-hf
HF_MAX_ENTRIES_PER_FOLDER=10000
HF_REC_FILES_PER_REPO=100000
HF_REC_FILE_BYTES=200000000000
HF_MAX_FILE_BYTES=500000000000
HF_PRIVATE_QUOTA_FREE=100000000000
HF_PRIVATE_QUOTA_PRO=1000000000000
HF_PUBLIC_NOTE_BYTES=50000000000
HF_PRE_VERIFY=${HF_PRE_VERIFY:-require}
HF_MESSAGE="TOM 1.0.0 revision: 149 added projects and the license values"
# The organization database: its published name and concept DOI (Zenodo) go into release_info; its build tag stays
# the footer key organizations_version of every project file (no footer rewrite).
ORG_DB_VERSION=1.0.0
ORG_DB_DOI=10.5281/zenodo.23744044
ORG_BUILD_TAG=v4.9
# The release DOI and date of TOM 1.0.0 (S1 fills TODO-DOI and TODO-DATE of the docs with them; no new DOI).
DOI=10.57967/hf/11505
DATE=2026-11-07
ALERT_HOLD_MIN=${ALERT_HOLD_MIN:-90}
SIZE_RULE="SS:0:1499 S:1500:2499 M:2500:4999 L:5000:14999 XL:15000:49999 XXL:50000:-"
