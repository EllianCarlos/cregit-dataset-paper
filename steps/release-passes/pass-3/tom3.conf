# tom3.conf: the values of the kit dataset-tom-3 (the third release pass of the dataset "Token on Me" (TOM) 1.0.0).
# A tool of the stage: S1 stages it, tom3_run.sh and the kit scripts source it.
BUCKET=BUCKET_NAME
# The input root (read only): the output of the second pass (kit ../dataset-tom-2), 8,449 project files, schema 3,
# 61 columns. The run reads all files of it.
TOM2=dataset-release/dataset-v1.0.0-tom-2
TOM2_ROOT=$TOM2/root
# The sha256 of the TOM-2 SHA256SUMS. Empty: the run takes root_sha256sums of TOM2/log/final.status.json (status
# DONE). S1 writes the value when TOM2_SUMS_SHA=<sha256> is given at stage time.
TOM2_SUMS_SHA=
# The new prefix: tools/ (the stage, U1), root/ (the new root; the run refuses a non-empty root/), log/.
DEST=dataset-release/dataset-v1.0.0-tom-3
MAX_PARQUET_FILES=9999
# The expected roots: files, token rows (footers), columns before and after the drop.
EXPECT_FILES=8449
EXPECT_ROWS=30408388202
EXPECT_IN_COLUMNS=61
EXPECT_COLUMNS=53
# The drop of pass 3 (user decision 2026-11-07, column review changes 27-34). No rename, no type change, no new
# key-value: ctp_schema_version stays 3 in every footer and in release_info.
DROP_COLUMNS="person_name person_email footer_person_names cregit_commit_sha repo_tag archived fork roster_lang"
SCHEMA_VERSION=3
# The proof of every file before the drop (tom3_tools.py prove). Each count must be 0, and the commit map must be
# one to one. archived and fork may only hold ARCHIVED_VALUES; repo_tag only the empty string; roster_lang one value
# per file. The expected files per value (the column review, footers of TOM-2: False 8,288, empty 161).
ARCHIVED_VALUES="False|"
EXPECT_ARCHIVED="False=8288 =161"
EXPECT_FORK="False=8288 =161"
# The new facts: one project_facts row (fact_type roster_language, fact_value = the roster_lang cell) for each
# project with a non-empty roster_lang.
ROSTER_FACT_TYPE=roster_language
EXPECT_ROSTER_FACTS=135
# The views that check-root requires (every view of organizations/dataset.duckdb runs; none names a dropped column).
NEED_VIEWS="tokens tokens_with_organizations tokens_with_current_organizations project_facts project_hosts project_sponsors project_languages project_labels release_info stale_files"
# The release_info keys that this pass changes (all other keys keep the TOM-2 value; check-root measures every key).
RI_CHANGED="project_facts_rows project_facts_sha256"
EXPECT_RI_KEYS=27
# TOM-2 files that the new root may lack (space-separated paths; empty: none may go). A gone file is deleted on the Hub.
ALLOW_GONE=""
# The ctp tools: branch feat/parquet-column-pass (drop by chunk copy, no re-encode).
CTP_COMMIT=e9c7656e59c18316cda1b83acf81cb1d8fc9bca6
COPY_MODE=read-write
# The smoke test of R1: the TOM-2 file SMOKE (its sha256 is SMOKE_IN_SHA: the file did not change in pass 1 or 2),
# the proof, then the drop and its check; the output sha256 must be SMOKE_OUT_SHA (local test 2026-11-07: ctp e9c7656 on
# the same input gives these bytes).
SMOKE=libexpat__libexpat-dataset.parquet
SMOKE_IN_SHA=a1b4fa6609afc8455b49c7fed0d3f0a4acc03bcd659eb8523cb9cb13cf3ecaec
SMOKE_OUT_SHA=fe3b38d80500a2c6726cec163b3ca937b86e23b4bf2b9d66f799fea430fd140b
# Pinned versions on the machine (the same as kits 1 and 2).
PYARROW=26.0.1
DUCKDB=1.5.5
HF_HUB_VERSION=2.4.0
HF_XET_VERSION=1.8.0
# The driver: JOBS empty = half the vCPU count (pass); PROVE_JOBS and PROVE_THREADS for the proof (DuckDB threads per
# file); MEM_PER_JOB is the DuckDB memory_limit of one proof.
JOBS=${JOBS:-}
PROVE_JOBS=${PROVE_JOBS:-}
PROVE_THREADS=${PROVE_THREADS:-4}
MEM_PER_JOB=${MEM_PER_JOB:-12GB}
# Hugging Face: the same repository as kits 1 and 2, public. All changed files are pushed (all project files change).
HF=${HF:-1}
HF_REPO=${HF_REPO:-elliancarlos/token-on-me}
HF_VISIBILITY=${HF_VISIBILITY:-public}
HF_SSM_PARAM=/tom/hf-token
HF_TOKEN_DIR=/run/tom3-hf
HF_BATCH_FILES=1000
HF_BATCH_BYTES=20000000000
HF_MAX_ENTRIES_PER_FOLDER=10000
HF_REC_FILES_PER_REPO=100000
HF_REC_FILE_BYTES=200000000000
HF_MAX_FILE_BYTES=500000000000
HF_PRIVATE_QUOTA_FREE=100000000000
HF_PRIVATE_QUOTA_PRO=1000000000000
HF_PUBLIC_NOTE_BYTES=50000000000
# The Hub must hold the TOM-2 root before the push (hf_tools.py verify against the TOM-2 SHA256SUMS): require or skip.
HF_PRE_VERIFY=${HF_PRE_VERIFY:-require}
# The end: on DONE the instance shuts down at once (L1 sets the stop behavior); on ALERT after ALERT_HOLD_MIN minutes.
ALERT_HOLD_MIN=${ALERT_HOLD_MIN:-90}
# The size rule of change 24 (commits of MANIFEST.tsv): the counts go to the placeholders.
SIZE_RULE="SS:0:1499 S:1500:2499 M:2500:4999 L:5000:14999 XL:15000:49999 XXL:50000:-"
# The canary: this file alone (proof, drop, check) before all others; the run stops when it fails.
CANARY=emscripten-core__emscripten-dataset.parquet
