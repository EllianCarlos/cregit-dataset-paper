# tom2.conf: the values of the kit dataset-tom-2 (the second release pass of the dataset "Token on Me" (TOM) 1.0.0).
# A tool of the stage: S1 stages it, tom2_run.sh and the kit scripts source it.
BUCKET=BUCKET_NAME
# The first root (read only): the output of the first pass (kit ../dataset-tom), 8,447 project files, schema 3.
TOM1=dataset-release/dataset-v1.0.0-tom
TOM1_ROOT=$TOM1/root
# The sha256 of the TOM-1 SHA256SUMS. Empty: the run takes root_sha256sums of TOM1/log/final.status.json (status
# DONE). S1 writes the value when TOM1_SUMS_SHA=<sha256> is given at stage time.
TOM1_SUMS_SHA=
TOM1_FILES=8447
TOM1_ROWS=30406900014
# The source root (read only): the re-encoded root, schema 2, 10,754 project files (the 2 new projects come from it).
SRC_ROOT=dataset-release/dataset-v1.0.0-reencode/root
SRC_SUMS_SHA=d35e913a0121a188857afef834c3eb11729a4e86e95335b0d0d5e165dbb48964
# The new prefix: tools/ (the stage, U1), root/ (the new root; the run refuses a non-empty root/), log/.
DEST=dataset-release/dataset-v1.0.0-tom-2
# The 2 projects to add (user decision 2026-11-07): the same drop + rename + set-kv as the first pass, then the fills.
ADD_PROJECTS="git.savannah.gnu.org__denemo git.savannah.gnu.org__gnubg"
MAX_PARQUET_FILES=9999
# The expected new root: files, token rows (footers), the files the value pass changes, the new files, the fills.
EXPECT_FILES=8449
EXPECT_ROWS=30408388202
EXPECT_VALUE_FILES=183
EXPECT_NEW_FILES=2
EXPECT_LANGUAGE_FILLS=161
EXPECT_LICENSE_FILLS=149
EXPECT_COLUMNS=61
# The column changes of the first pass (only for the new files; the TOM-1 files have them already).
DROP_COLUMNS="size_kb file_mask manifest_category fact history_cluster history_shared_with history_relation history_includes history_first history_created"
RENAME="provenance_status=audit_frame_file"
SET_KV="ctp_schema_version=3"
EXPECT_EMPTY="size_kb history_cluster history_shared_with history_relation history_includes history_first history_created"
EXPECT_MANIFEST_CATEGORY=pending
EXPECT_FILE_MASK='(?i)\.(c|c\+\+|cc|cp|cpp|cxx|h|h\+\+|hh|hpp|hxx|java|rs|tcc)$'
# The side tables (stage inputs/, made by tom2_tools.py prepare) and their views in organizations/dataset.duckdb.
SIDE_TABLES="project_languages project_labels"
# The columns of project_labels (the all-kinds recompute; user decision 2026-11-07).
LABEL_COLUMNS="project stratum stratum_all_kinds added_fact_all_kinds namespace_owner namespace_owner_kind basis"
# The views that check-root requires.
NEED_VIEWS="tokens project_facts project_hosts project_sponsors project_languages project_labels release_info"
# TOM-1 files that the new root may lack (space-separated paths; empty: none may go). A gone file is deleted on the Hub.
ALLOW_GONE=""
# The ctp tools: branch feat/parquet-column-pass (merge of feat/parquet-replace-values c570cd1 into
# feat/parquet-footer-rename 467677c8): --values, --set, --set-null, --force-multi and --set-kv in one pass.
CTP_COMMIT=e9c7656e59c18316cda1b83acf81cb1d8fc9bca6
COPY_MODE=read-write
# The smoke test of R1: drop + rename + set-kv of the source file SMOKE, the output sha256 of kit 1 (the merged tool
# gives the same bytes as 467677c8: local test 2026-11-07), then a value pass of that output (a test value).
SMOKE=libexpat__libexpat-dataset.parquet
SMOKE_OUT_SHA=a1b4fa6609afc8455b49c7fed0d3f0a4acc03bcd659eb8523cb9cb13cf3ecaec
# Pinned versions on the machine (the same as kit 1), and boto3 for the footer reads.
PYARROW=26.0.1
DUCKDB=1.5.5
HF_HUB_VERSION=2.4.0
HF_XET_VERSION=1.8.0
BOTO3_SPEC="boto3>=1.35,<2"
# The footer reads: threads, and the first ranged read (the end of each file).
FOOTER_JOBS=${FOOTER_JOBS:-48}
FOOTER_FIRST=262144
# The driver: JOBS empty = half the vCPU count.
JOBS=${JOBS:-}
# The S3 copy of the unchanged files (server side) and the ETag compare: require (every unchanged object has the
# TOM-1 ETag) or report.
ETAG_CHECK=${ETAG_CHECK:-report}
# Hugging Face: the same repository as kit 1, public. Only the changed and new files are pushed.
HF=${HF:-1}
HF_REPO=${HF_REPO:-elliancarlos/token-on-me}
HF_VISIBILITY=${HF_VISIBILITY:-public}
HF_SSM_PARAM=/tom/hf-token
HF_TOKEN_DIR=/run/tom2-hf
HF_MAX_ENTRIES_PER_FOLDER=10000
HF_REC_FILES_PER_REPO=100000
HF_REC_FILE_BYTES=200000000000
HF_MAX_FILE_BYTES=500000000000
HF_PRIVATE_QUOTA_FREE=100000000000
HF_PRIVATE_QUOTA_PRO=1000000000000
HF_PUBLIC_NOTE_BYTES=50000000000
# The Hub must hold the TOM-1 root before the push (hf_tools.py verify against the TOM-1 SHA256SUMS): require or skip.
HF_PRE_VERIFY=${HF_PRE_VERIFY:-require}
# The end: on DONE the instance shuts down at once (L1 sets the stop behavior); on ALERT after ALERT_HOLD_MIN minutes.
ALERT_HOLD_MIN=${ALERT_HOLD_MIN:-90}
# The size rule of change 24 (commits of MANIFEST.tsv): the counts go to the placeholders.
SIZE_RULE="SS:0:1499 S:1500:2499 M:2500:4999 L:5000:14999 XL:15000:49999 XXL:50000:-"
