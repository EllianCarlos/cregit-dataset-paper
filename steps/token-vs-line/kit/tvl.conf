# tvl.conf: the values of the kit token-vs-line (line authorship against token authorship on the random sample of
# 250 TOM 1.0.0 projects). S1 stages it; tvl_unit.sh and tvl_run.py read it. An environment value of the same name
# wins (EXPORTS of ssm-tvl.sh).
BUCKET=BUCKET_NAME
# The release root of TOM 1.0.0 (final revision; read only). Its SHA256SUMS: the byte size of the S3 listing of
# 2026-11-09 (the run checks it and writes its sha256 into run-info.tsv); the TOM files must match its rows.
ROOT=dataset-release/dataset-v1.0.0-tom-5/root
ROOT_SUMS_SIZE=962043
ROOT_SUMS_SHA=
# The run prefix: s3://BUCKET/RUN_PREFIX/<TVL_RUN>/{results,tables,log,status}; the stage: s3://BUCKET/TOOLS_PREFIX/.
RUN_PREFIX=token-vs-line/run
TOOLS_PREFIX=token-vs-line/tools
# The sample: the first N projects of the draw (plan.tsv, seed 20261109, column draw_rank).
N=250
# Work: git jobs of the blames; clone workers; the blame limits for each file (seconds).
JOBS=60
CLONE_JOBS=8
LIMIT_PLAIN=1800
LIMIT_W=1800
LIMIT_WMC=600
# Clones: the backoff before each retry (seconds; GitHub 3 attempts, other hosts 5 attempts), the time limit of
# one attempt.
BACKOFF_GITHUB=30,120
BACKOFF_OTHER=60,300,900,1800
CLONE_TIMEOUT_S=7200
# Measure: DuckDB threads and memory for each project (GB; BIG for projects with more TOM rows than BIG_ROWS) and
# the memory budget of all measures at the same time.
MEASURE_THREADS=8
MEASURE_GB=24
MEASURE_BIG_GB=96
MEASURE_BIG_ROWS=20000000
MEASURE_BUDGET_GB=144
# The run cap (hours from the first start): the blames stop RESERVE_MIN before it.
CAP_H=14
RESERVE_MIN=50
PROGRESS_S=300
UPLOAD_BLAME=1
ALERT_HOLD_MIN=90
NICE=10
# Pinned versions on the machine.
DUCKDB=1.5.5
